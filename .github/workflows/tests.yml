name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check launcher syntax
        run: bash -n "Rhythm First.command" scripts/run_rhythm_first_macos.command
      - name: Smoke-test one-click launcher
        run: RHYTHM_FIRST_LAUNCHER_SMOKE_TEST=1 "./Rhythm First.command"
      - name: Run tests
        run: python -m unittest discover -s tests -v
